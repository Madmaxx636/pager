# Pager server stack. Run ./scripts/setup.sh first. It generates data/bridges.compose.yml, which .env pulls in via COMPOSE_FILE.
name: pager

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pager"]
      interval: 5s
      retries: 10
    networks: [pager]

  synapse:
    image: docker.io/matrixdotorg/synapse:latest
    restart: unless-stopped
    environment:
      # Rootless Podman maps the container's root to your user, so run as root there; Docker keeps the image's default user.
      UID: ${SYNAPSE_UID:-991}
      GID: ${SYNAPSE_GID:-991}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/synapse:/data
    networks: [pager]

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      PAGER_ADDRESS: ${PAGER_ADDRESS:-${PAGER_DOMAIN}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ../app/dist:/srv/app:ro
    depends_on: [synapse]
    networks: [pager]

  api:
    build: ../api
    restart: unless-stopped
    environment:
      PAGER_DOMAIN: ${PAGER_DOMAIN}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET}
      PROVISIONING_SECRET: ${PROVISIONING_SECRET}
      INVITE_CODE: ${INVITE_CODE}
      ADMIN_INVITE_CODE: ${ADMIN_INVITE_CODE:-}
      STATE_FILE: /state/settings.json
      SIGNUP_MODE: ${SIGNUP_MODE:-invite}
      BRIDGES_FILE: /config/bridges.json
    volumes:
      - ./data/bridges.json:/config/bridges.json:ro
      - ./data/api:/state
    depends_on: [synapse]
    networks: [pager]

  # Keeps a DuckDNS name pointed at your home IP. Enabled by setup.sh when DUCKDNS_TOKEN is in .env.
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    profiles: ["duckdns"]
    restart: unless-stopped
    environment:
      SUBDOMAINS: ${DUCKDNS_SUBDOMAIN:-}
      TOKEN: ${DUCKDNS_TOKEN:-}
    networks: [pager]

networks:
  pager:
