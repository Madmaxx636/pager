# Pager server stack. Run ./scripts/setup.sh first. It generates data/bridges.compose.yml, which .env pulls in via COMPOSE_FILE.
name: pager

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pager"]
      interval: 5s
      retries: 10
    networks: [pager]

  synapse:
    image: matrixdotorg/synapse:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/synapse:/data
    networks: [pager]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      PAGER_DOMAIN: ${PAGER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ../app/dist:/srv/app:ro
    depends_on: [synapse]
    networks: [pager]

  api:
    build: ../api
    restart: unless-stopped
    environment:
      PAGER_DOMAIN: ${PAGER_DOMAIN}
      REGISTRATION_SECRET: ${REGISTRATION_SECRET}
      PROVISIONING_SECRET: ${PROVISIONING_SECRET}
      INVITE_CODE: ${INVITE_CODE}
      SIGNUP_MODE: ${SIGNUP_MODE:-invite}
      BRIDGES_FILE: /config/bridges.json
    volumes:
      - ./data/bridges.json:/config/bridges.json:ro
    depends_on: [synapse]
    networks: [pager]

networks:
  pager:
