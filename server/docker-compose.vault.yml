# Added to the stack by scripts/vault-migrate.sh: the bridges get their own database, stored in the encrypted vault
# (see scripts/vault-setup.sh), so logins, keys and message data for WhatsApp, Signal and the rest are encrypted on disk.
services:
  bridgedb:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      # create_host_path: false means that if the vault is not mounted, this container refuses to start instead of quietly making an empty, unencrypted database.
      - type: bind
        source: ${VAULT_DIR}/bridgedb
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pager"]
      interval: 5s
      retries: 10
    networks: [pager]
